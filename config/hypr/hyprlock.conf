# ----------------------------------------------------- 
# Hyprlock Configuration 
# ----------------------------------------------------- 
# Sourced from https://github.com/fufexan/dotfiles/blob/main/config/hypr/hyprlock.conf 
# ----------------------------------------------------- 

# --- Background ---
background {
    monitor = 
    path = ~/Pictures/wallpaper/dead-robot.jpg # You can change this path
    color = #16161D # sumiInk0

    # --- Blur ---
    blur_passes = 2
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- General ---
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# --- Input Field ---
input-field {
    size = 220, 60
    outline_thickness = 4
    dots_size = 0.2 # Scale of dots relative to font size
    dots_spacing = 0.64 # Spacing between dots
    dots_center = true
    dots_rounding = -1 # -1 means full rounding
    outer_color = #6A95AE # dragonBlue
    inner_color = #2D4F67 # waveBlue2
    font_color = #C8C093 # fujiWhite
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = -1
    position = 0, -35
    halign = center
    valign = center
}

# --- Clock ---
label {
    text = cmd[update:1000] echo "<span><b> $TIME12 </b></span>"
    color = #C8C093 # fujiWhite
    font_size = 100
    font_family = JetBrains Mono Nerd Font
    position = 0, 0
    halign = rigth
    valign = top
    shadow_passes = 2
    shadow_size = 4
    shadow_color = #16161D # sumiInk0
}

# --- User ---
label {
    monitor = 
    text = Hi, $USER
    color = #C8C093 # fujiWhite
    font_size = 28
    font_family = JetBrains Mono Nerd Font
    position = 0, 80
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = #16161D # sumiInk0
}

# --- Fails ---
label {
    monitor = 
    text = $FAIL
    color = #C34043 # dragonRed
    font_size = 22
    font_family = JetBrains Mono Nerd Font
    position = 0, -120
    halign = center
    valign = center
}
