[main]
# --- Diseño Compacto y Mínimo ---
# Ancho (se ajustará al contenido, pero ponemos un límite)
width=60
# Altura, limitada a 5 líneas para compactar
# Espacios internos mínimos (padding)
padding=5
inner-padding=5
spacing=2
# Se elimina 'height' para que se ajuste a 'lines'

# --- Prompt con Icono JetBrains y Fuente ---
terminal=kitty
font=JetBrainsMono Nerd Font:size=16
icons-enabled=yes
prompt=" > "

# --- Colores Kanagawa (en sección [main] para la v1.13.1) ---
# Formato RGBA de 8 dígitos (Opacidad Total FF)
[colors]
background=1F1F28FF
text=C8C093FF
prompt=98BB6CFF
input=C8C093FF
match=C34043FF
counter=C8C093FF

selection=223249FF
selection-text=C8C093FF
selection-match=C34043FF

border=7E9CD8FF

[border]
width=2
radius=10

[scrollbar]
width=5
border-width=0
handle-color=7E9CD8FF
